name: Uptime

# P7-09: server-side probes only. No browser monitoring SDK is loaded by the
# site; this workflow does the checking from GitHub's runners.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    name: Probe production routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.PRODUCTION_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Probe
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          # The pages.dev alias must stay noindex; the probe asserts the header.
          PAGES_URL: ${{ vars.PAGES_URL || 'https://soloyolo.pages.dev' }}
        run: node scripts/uptime-probe.mjs
