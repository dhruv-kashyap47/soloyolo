name: Deploy

# Manual production deploy. The CI workflow deploys after `verify` on every
# push to main; this one is for redeploying an existing commit without waiting
# for the full 30-minute suite (for example, after rotating a secret).
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://soloyolotools.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production artifact
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://soloyolotools.com' }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT_LEADERBOARD: ${{ vars.PUBLIC_ADSENSE_SLOT_LEADERBOARD }}
          PUBLIC_ADSENSE_SLOT_INFEED: ${{ vars.PUBLIC_ADSENSE_SLOT_INFEED }}
          PUBLIC_ADSENSE_SLOT_SIDEBAR: ${{ vars.PUBLIC_ADSENSE_SLOT_SIDEBAR }}
          PUBLIC_ADSENSE_SLOT_ANCHOR: ${{ vars.PUBLIC_ADSENSE_SLOT_ANCHOR }}
          PUBLIC_ADSENSE_SLOT_END: ${{ vars.PUBLIC_ADSENSE_SLOT_END }}
        run: pnpm build

      - name: Check the production artifact
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://soloyolotools.com' }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
        run: node scripts/check-production-build.mjs

      - name: Verify token access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          API=https://api.cloudflare.com/client/v4
          for endpoint in \
            "/user/tokens/verify" \
            "/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            "/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/soloyolo"
          do
            code=$(curl -sS -o /tmp/cf-check.json -w '%{http_code}' \
              "$API$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            echo "GET $endpoint -> $code"
            head -c 500 /tmp/cf-check.json; echo
          done
          code=$(curl -sS -o /tmp/cf-upload.json -w '%{http_code}' -X POST \
            "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/soloyolo/upload-token" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "POST /accounts/.../pages/projects/soloyolo/upload-token -> $code"
          head -c 500 /tmp/cf-upload.json; echo

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.169.0'
          command: pages deploy dist --project-name=soloyolo --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
