name: Deploy

# Manual production deploy for redeploying an existing commit (for example,
# after rotating a secret). It runs the same gate as CI before the deploy job:
# secret scan, dependency audit and `pnpm verify` (typecheck, lint, unit tests,
# build). E2E still runs on the push to main; this path exists for redeploys.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.15.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm check:secrets

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Typecheck, lint, unit tests and build
        run: pnpm verify

  deploy:
    name: Build and deploy to Cloudflare Pages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewers must be configured on this environment in GitHub
    # settings; the workflow cannot enforce that by itself.
    environment:
      name: production
      url: https://soloyolotools.com
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.15.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production artifact
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://soloyolotools.com' }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT_LEADERBOARD: ${{ vars.PUBLIC_ADSENSE_SLOT_LEADERBOARD }}
          PUBLIC_ADSENSE_SLOT_INFEED: ${{ vars.PUBLIC_ADSENSE_SLOT_INFEED }}
          PUBLIC_ADSENSE_SLOT_SIDEBAR: ${{ vars.PUBLIC_ADSENSE_SLOT_SIDEBAR }}
          PUBLIC_ADSENSE_SLOT_ANCHOR: ${{ vars.PUBLIC_ADSENSE_SLOT_ANCHOR }}
          PUBLIC_ADSENSE_SLOT_END: ${{ vars.PUBLIC_ADSENSE_SLOT_END }}
        run: pnpm build

      - name: Check the production artifact
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://soloyolotools.com' }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
        run: node scripts/check-production-build.mjs

      - name: Deploy
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.169.0'
          command: pages deploy dist --project-name=soloyolo --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
